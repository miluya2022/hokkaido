        // ==========================================
        // 2. 負責生成 HTML 的函數
        // ==========================================
        function renderItinerary() {
            const container = document.getElementById('plans-container');
            let htmlContent = '';

            function getDateString(dayNum) {
                const dates = {
                    1: '6/23 (二)',
                    2: '6/24 (三)',
                    3: '6/25 (四)',
                    4: '6/26 (五)',
                    5: '6/27 (六)',
                    6: '6/28 (日)'
                };
                return dates[dayNum] || '';
            }

            for (const key in itineraryData) {
                if (key === 'planA' || key === 'planC') continue; // 隱藏 A 案與 C 案
                const plan = itineraryData[key];
                const isActive = key === 'planB' ? 'active' : ''; // 預設顯示 B 案

                // 組合方案的頭部
                let planHtml = `
                <div id="${plan.id}" class="tab-content ${isActive}">
                    <div class="mb-6 text-center">
                        <h2 class="text-2xl font-bold ${plan.theme.textTitle}">${plan.title}</h2>
                        <p class="text-gray-600">${plan.description}</p>
                    </div>`;

                // 跑迴圈組合每一天的卡片
                plan.days.forEach(day => {
                    const imgHtml = day.img ? `<img src="${day.img}" class="w-full h-40 object-cover">` : '';
                    const detailsHtml = day.details.map(item => `<p>${item}</p>`).join('');

                    planHtml += `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden mb-6 border-l-8 ${plan.theme.borderLeft}">
                        ${imgHtml}
                        <div class="p-6">
                            <h3 class="text-xl font-bold mb-2 flex items-center flex-wrap gap-y-1">
                                <span class="${plan.theme.badgeBg} text-white text-xs px-2 py-1 rounded mr-2">Day ${day.dayNum}</span> 
                                <span class="text-gray-500 text-sm font-semibold mr-2">${getDateString(day.dayNum)}</span>
                                ${day.title}
                            </h3>
                            <div class="text-gray-700 space-y-2 text-sm">
                                ${detailsHtml}
                            </div>
                        </div>
                    </div>`;
                });

                // 組合收尾
                planHtml += `
                </div>`;

                htmlContent += planHtml;
            }

            container.innerHTML = htmlContent;
        }

        // ==========================================
        // 3. 負責切換分頁的函數
        // ==========================================
        function switchTab(planId) {
            // 隱藏所有內容
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

            // 移除所有按鈕的活躍樣式
            ['btn-planA', 'btn-planB', 'btn-planC'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.className = "px-12 py-4 text-center font-bold border-b-4 border-transparent text-gray-500 hover:bg-gray-100 transition" + (id !== 'btn-planB' ? " hidden" : "");
                }
            });

            // 顯示目標內容
            const targetEl = document.getElementById(planId);
            if (targetEl) {
                targetEl.classList.add('active');
            }

            // 設定目標按鈕的專屬活躍樣式
            const activeBtn = document.getElementById('btn-' + planId);
            let colorClass = "";
            if (planId === 'planA') colorClass = "text-green-700 border-green-500 bg-green-50";
            if (planId === 'planB') colorClass = "text-red-700 border-red-500 bg-red-50";
            if (planId === 'planC') colorClass = "text-blue-700 border-blue-500 bg-blue-50";

            if (activeBtn) {
                activeBtn.className = `px-12 py-4 text-center font-bold border-b-4 ${colorClass} transition` + (planId !== 'btn-planB' ? " hidden" : "");
            }
        }

        // ==========================================
        // 4. 網頁載入時自動執行渲染
        // ==========================================
        renderItinerary();
        // ==========================================
        // 5. 監聽 iframe 傳來的高度資訊
        // ==========================================
        window.addEventListener('message', function (e) {
            // 這裡可以加上來源檢查，確保安全性 e.origin
            // 但因為 GAS 的 origin 每次執行可能會變，這裡先暫時寬鬆
            if (e.data && e.data.frameHeight) {
                const iframe = document.getElementById('comment-iframe');
                if (iframe) {
                    iframe.style.height = e.data.frameHeight + 'px';
                }
            }
        });
    </script>
